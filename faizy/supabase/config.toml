project_id = "faizy"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[storage]
enabled = true
# Buckets and their policies are created by migration 0008.
file_size_limit = "25MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3001", "http://localhost:3002"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# No email/password anywhere in Faizy — the phone number is the account.
enable_signup = true

[auth.email]
enable_signup = false
enable_confirmations = false

[auth.sms]
enable_signup = true
enable_confirmations = true
# 6-digit OTP.
template = "Your Faizy code is {{ .Code }}"

# WhatsApp OTP delivery via Twilio. Meta Cloud API cannot currently be used as a
# Supabase Auth SMS provider directly, so the OTP path uses Twilio even when the
# NOTIFICATION path uses Meta — see docs/00-decisions.md §2. That split is
# intentional, not an oversight.
[auth.sms.twilio]
enabled = true
account_sid = "env(TWILIO_ACCOUNT_SID)"
message_service_sid = "env(TWILIO_MESSAGE_SERVICE_SID)"
auth_token = "env(TWILIO_AUTH_TOKEN)"

[realtime]
enabled = true

[edge_runtime]
enabled = true

[functions.send-whatsapp]
# The drain is called on a schedule with a shared secret, not by end users.
verify_jwt = false
