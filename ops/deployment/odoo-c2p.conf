[options]
; ── Dedicated Odoo instance for core2plus.com → ONLY Mumtaz_C2P ───────────────
; This instance is locked to a single database. Because dbfilter matches exactly
; one DB and list_db is off, a browser hitting core2plus.com can never reach or
; even see any other database on the server.
;
; IMPORTANT — copy two values from your LIVE /etc/odoo/odoo.conf so this matches
; your install (versions/paths differ per box):
;     grep -E '^(db_password|addons_path)' /etc/odoo/odoo.conf
; and paste them below where marked.

; ── Database ────────────────────────────────────────────────────────────────
db_host     = localhost
db_port     = 5432
db_user     = odoo
db_password = <COPY FROM /etc/odoo/odoo.conf>

; Lock this instance to the single C2P database.
dbfilter    = ^Mumtaz_C2P$
db_name     = Mumtaz_C2P

; ── Server (its own ports, separate from odoo.service:8069 / odoo2) ──────────
http_port   = 8071
; Odoo 16+ renamed longpolling_port → gevent_port. Use whichever your version
; expects (check: /usr/bin/odoo --version). Only one of these should be set.
gevent_port = 8074
;longpolling_port = 8074
proxy_mode  = True
workers     = 2

; ── Addons — MUST match your live instance so custom modules load ────────────
addons_path = <COPY FROM /etc/odoo/odoo.conf>

; ── Security — no public DB manager; single-DB only ──────────────────────────
list_db     = False

; ── Logging ──────────────────────────────────────────────────────────────────
logfile     = /var/log/odoo/odoo-c2p.log
log_level   = info

; ── Limits ───────────────────────────────────────────────────────────────────
limit_memory_hard  = 2684354560
limit_memory_soft  = 2147483648
limit_request      = 8192
limit_time_cpu     = 120
limit_time_real    = 240
