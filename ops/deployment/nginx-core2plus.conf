# ─────────────────────────────────────────────────────────────────────────────
# core2plus.com → dedicated Odoo instance (Mumtaz_C2P only) on 127.0.0.1:8071
# Web on 8071, websocket/longpolling on 8074 (see odoo-c2p.conf).
# certbot --nginx will inject the SSL server block + 80→443 redirect.
# ─────────────────────────────────────────────────────────────────────────────
upstream odoo_c2p_web {
    server 127.0.0.1:8071;
    keepalive 32;
}
upstream odoo_c2p_longpoll {
    server 127.0.0.1:8074;
    keepalive 32;
}

server {
    listen 80;
    server_name core2plus.com www.core2plus.com;
    client_max_body_size 100m;

    # Odoo websocket bus (Odoo 16+). Keep before location / .
    location /websocket {
        proxy_pass http://odoo_c2p_longpoll;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 720s;
    }

    location /longpolling {
        proxy_pass http://odoo_c2p_longpoll;
        proxy_set_header Host $host;
        proxy_read_timeout 720s;
    }

    location / {
        proxy_pass http://odoo_c2p_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 720s;
        proxy_connect_timeout 720s;
        proxy_send_timeout 720s;
        proxy_redirect off;
    }

    location ~* /web/static/ {
        proxy_cache_valid 200 90d;
        proxy_buffering on;
        proxy_pass http://odoo_c2p_web;
        proxy_set_header Host $host;
        expires 90d;
    }
}
