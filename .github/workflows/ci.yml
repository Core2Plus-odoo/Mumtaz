name: Mumtaz CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

jobs:
  # ────────────────────────────────────────────────────────────────────
  # 1. Manifest validation
  # Parses every __manifest__.py and checks structural integrity.
  # ────────────────────────────────────────────────────────────────────
  manifest-lint:
    name: Validate Module Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate __manifest__.py files
        run: |
          import ast, sys, pathlib

          required_keys = {"name", "version", "depends", "license"}
          errors = []

          for path in pathlib.Path(".").glob("addons/mumtaz_*/__manifest__.py"):
              try:
                  tree = ast.parse(path.read_text())
                  # The manifest must be a single dict literal at module level
                  if not (tree.body and isinstance(tree.body[0], ast.Expr)
                          and isinstance(tree.body[0].value, ast.Dict)):
                      errors.append(f"{path}: not a plain dict literal")
                      continue
                  node = tree.body[0].value
                  keys = {
                      k.s if isinstance(k, ast.Constant) else None
                      for k in node.keys
                  }
                  missing = required_keys - keys
                  if missing:
                      errors.append(f"{path}: missing keys {missing}")
              except SyntaxError as e:
                  errors.append(f"{path}: syntax error — {e}")

          if errors:
              print("Manifest errors found:")
              for e in errors:
                  print(" ✗", e)
              sys.exit(1)

          print(f"All {len(list(pathlib.Path('.').glob('mumtaz_*/__manifest__.py')))} manifests valid.")
        shell: python

  # ────────────────────────────────────────────────────────────────────
  # 2. Python lint
  # ────────────────────────────────────────────────────────────────────
  python-lint:
    name: Python Lint (flake8 + pyupgrade)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linters
        run: pip install flake8 flake8-bugbear

      - name: flake8
        run: flake8 addons/ tools/scrapers/   # config in .flake8 at repo root

      # Every sudo() widens access past the signed-in user; each call site
      # must say why (docs/erp/architecture/SECURITY_MATRIX.md).
      - name: sudo() calls are justified
        run: python3 scripts/check_sudo.py addons

  # ────────────────────────────────────────────────────────────────────
  # 3. Security scan
  # Checks for hardcoded secrets and known-vulnerable patterns.
  # ────────────────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit
        run: |
          bandit -r addons/ tools/scrapers/ \
            --severity-level medium \
            --confidence-level medium \
            --skip B101,B311,B603,B607 \
            -f txt

  # ────────────────────────────────────────────────────────────────────
  # 4. XML validation
  # Ensures all Odoo XML data files are well-formed.
  # ────────────────────────────────────────────────────────────────────
  xml-lint:
    name: Validate XML Data Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Validate XML
        run: |
          set -e
          errors=0
          while IFS= read -r -d '' f; do
            if ! xmllint --noout "$f" 2>/dev/null; then
              echo "✗ Invalid XML: $f"
              errors=$((errors + 1))
            fi
          done < <(find addons/ -name "*.xml" -print0)

          if [ "$errors" -gt 0 ]; then
            echo "Found $errors XML errors."
            exit 1
          fi
          echo "All XML files valid."

  # ────────────────────────────────────────────────────────────────────
  # 5. Module dependency audit
  # Verifies every module listed in 'depends' actually exists locally
  # or is a known Odoo/OCA standard module.
  # ────────────────────────────────────────────────────────────────────
  dependency-audit:
    name: Module Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit inter-module dependencies
        run: |
          import ast, pathlib, sys

          # Modules that exist in this repo
          local_modules = {
              p.parent.name
              for p in pathlib.Path(".").glob("addons/mumtaz_*/__manifest__.py")
          }

          # Known Odoo core / OCA modules (non-exhaustive whitelist)
          KNOWN_EXTERNAL = {
              "base", "mail", "web", "website", "account", "crm", "sale",
              "sale_management", "purchase", "stock", "hr", "project",
              "contacts", "base_setup", "portal", "utm", "auth_signup",
              "website_crm",  # standard Odoo CE: native website form -> crm.lead
          }

          errors = []
          for path in pathlib.Path(".").glob("addons/mumtaz_*/__manifest__.py"):
              module = path.parent.name
              tree = ast.parse(path.read_text())
              node = tree.body[0].value
              deps = []
              for k, v in zip(node.keys, node.values):
                  if isinstance(k, ast.Constant) and k.s == "depends":
                      if isinstance(v, ast.List):
                          deps = [
                              el.s for el in v.elts
                              if isinstance(el, ast.Constant)
                          ]
              for dep in deps:
                  if dep not in local_modules and dep not in KNOWN_EXTERNAL:
                      errors.append(
                          f"{module}: unknown dependency '{dep}'"
                          " (not in repo, not in whitelist)"
                      )

          if errors:
              print("Dependency issues:")
              for e in errors:
                  print(" ✗", e)
              sys.exit(1)

          print("All dependencies look clean.")
        shell: python

  # ────────────────────────────────────────────────────────────────────
  # 5b. Module registry and layering
  # Every module is classified into a layer (registry/classification.json);
  # a lower layer may not depend on a higher one; registry.yaml is current.
  # ────────────────────────────────────────────────────────────────────
  module-registry:
    name: Module Registry and Layering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Registry is current and layering holds
        run: python3 scripts/module_registry.py --check

  # ────────────────────────────────────────────────────────────────────
  # 6. Secrets scanning — TruffleHog
  # Detects accidentally committed secrets, API keys, and credentials.
  # ────────────────────────────────────────────────────────────────────
  secrets-scan:
    name: Secrets Scan (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # `base` used to be the default branch unconditionally, so a push to main
      # compared main against itself and the action exited 1 with "BASE and HEAD
      # commits are the same" before scanning anything. The job had been red on
      # every push to main since at least 11 Nov without ever having found a
      # secret. Splitting by event keeps the diff scan while making the
      # degenerate comparisons impossible.
      - name: TruffleHog OSS (pull request)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

      # On a push, scan only what the push introduced. The first push of a new
      # branch reports an all-zero `before`, which the action also rejects, so
      # that case is skipped rather than failed — the pull request scan above is
      # the gate that every change has to pass anyway.
      - name: TruffleHog OSS (push)
        if: >-
          github.event_name == 'push' &&
          github.event.before != '0000000000000000000000000000000000000000'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.sha }}
          extra_args: --only-verified

  # ────────────────────────────────────────────────────────────────────
  # 7. Python dependency audit — pip-audit
  # Checks for known CVEs in the active c2p-delivery-system backend deps.
  # ────────────────────────────────────────────────────────────────────
  pip-audit:
    name: Python Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit c2p-delivery-system dependencies
        run: pip-audit -r c2p-delivery-system/delivery_api/requirements.txt

  # ────────────────────────────────────────────────────────────────────
  # 8. Node.js dependency audit — npm audit
  # Checks for known CVEs in zaki-ai Node dependencies.
  # ────────────────────────────────────────────────────────────────────
  npm-audit:
    name: Node Dependency Audit (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install zaki-ai deps
        working-directory: sites/zaki.mumtaz.digital/node-app
        run: npm ci --ignore-scripts

      - name: npm audit
        working-directory: sites/zaki.mumtaz.digital/node-app
        run: npm audit --audit-level=high

  # ────────────────────────────────────────────────────────────────────
  # 9. Dockerfile lint — hadolint
  # Catches Dockerfile anti-patterns and security issues.
  # ────────────────────────────────────────────────────────────────────
  dockerfile-lint:
    name: Dockerfile Lint (hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  # ────────────────────────────────────────────────────────────────────
  # 10. Deployment dry-run (Hostinger website)
  # Validates that the website folder has the required entry points.
  # ────────────────────────────────────────────────────────────────────
  website-check:
    name: Website Deployment Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required website files
        run: |
          set -e
          required=(
            "sites/delivery.mumtaz.digital/landing/index.html"
            "sites/delivery.mumtaz.digital/landing/assets/css/style.css"
            "sites/delivery.mumtaz.digital/landing/assets/js/main.js"
          )
          errors=0
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              echo "✗ Missing: $f"
              errors=$((errors+1))
            else
              echo "✓ Found: $f"
            fi
          done
          if [ "$errors" -gt 0 ]; then exit 1; fi

      # A broken link on this host does not 404: nginx answers any unknown
      # path with the landing page, so a dead link silently shows the
      # homepage and nobody notices. On-disk only here — the live pass needs
      # the deployed host and runs from deploy/jewel-staging/.
      - name: Check Jewel site links
        run: python3 scripts/check_links.py --root website/jewel
