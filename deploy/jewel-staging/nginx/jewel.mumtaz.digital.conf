# jewel.mumtaz.digital — Mumtaz Jewel staging/demo (Odoo 19 on 127.0.0.1:8072).
#
# NOT INSTALLED. This file is a proposal for review. Installing it on the VPS
# and creating the DNS record are production-infrastructure changes and need a
# named approval (docs/mumtaz-jewel/CLAUDE_CODE_HANDOFF.md, section 3).
#
# Before this block will load, two things must exist:
#   1. an A record for `jewel` pointing at the VPS, made by whoever holds the
#      DNS for mumtaz.digital;
#   2. a certificate, by the same method the other sites on this box use:
#        certbot certonly --nginx -d jewel.mumtaz.digital
#      Until it exists nginx will refuse to start with this block in place, so
#      obtain the certificate first.
#
# Installing, once approved:
#   cp jewel.mumtaz.digital.conf /etc/nginx/sites-available/
#   ln -s /etc/nginx/sites-available/jewel.mumtaz.digital.conf \
#         /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# It adds a new server block and touches no other site's config.
#
# `listen 443 ssl;` without `http2` matches the other confs in this repo and
# works on every nginx version. On nginx 1.25+ you may add `http2 on;`.

upstream jewel_odoo {
    server 127.0.0.1:8072;
}
upstream jewel_odoo_poll {
    server 127.0.0.1:8073;
}

server {
    listen 443 ssl;
    server_name jewel.mumtaz.digital;

    ssl_certificate     /etc/letsencrypt/live/jewel.mumtaz.digital/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jewel.mumtaz.digital/privkey.pem;

    # A demo database must never be indexed.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    client_max_body_size 100m;
    access_log /opt/mumtaz/logs/jewel-staging.log;
    error_log  /opt/mumtaz/logs/jewel-staging.error.log;

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        # While this is a demo host, access needs EITHER a listed address or
        # the demo password. `satisfy any` is what makes it either/or: with
        # `satisfy all` a listed address would still be prompted.
        #
        # Create the password file on the VPS (never commit it):
        #   htpasswd -c /etc/nginx/.htpasswd-jewel demo
        satisfy any;
        # Add the office / owner / demo-room addresses here, then reload:
        # allow 203.0.113.4/32;
        # allow 198.51.100.0/24;
        deny all;
        auth_basic           "Mumtaz Jewel demo";
        auth_basic_user_file /etc/nginx/.htpasswd-jewel;

        proxy_pass http://jewel_odoo;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_read_timeout 720s;
        proxy_connect_timeout 720s;
        proxy_send_timeout 720s;
    }

    # Odoo's long-polling worker (chatter, activity notifications).
    location /websocket {
        satisfy any;
        # allow 203.0.113.4/32;
        deny all;
        auth_basic           "Mumtaz Jewel demo";
        auth_basic_user_file /etc/nginx/.htpasswd-jewel;

        proxy_pass http://jewel_odoo_poll;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 720s;
    }

    # Odoo's static assets are content-hashed, so they cache hard.
    location ~* /web/static/ {
        satisfy any;
        # allow 203.0.113.4/32;
        deny all;
        auth_basic           "Mumtaz Jewel demo";
        auth_basic_user_file /etc/nginx/.htpasswd-jewel;

        proxy_pass http://jewel_odoo;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        expires 60m;
    }

    gzip on;
    gzip_types text/css text/plain application/javascript application/json
               application/xml image/svg+xml;
}

server {
    listen 80;
    server_name jewel.mumtaz.digital;
    # Leave the ACME path reachable so certbot can renew over HTTP.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
