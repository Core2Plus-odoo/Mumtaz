# jewel.mumtaz.digital — Jawhar.
#
#   /          the landing page, PUBLIC, static from website/jewel/
#   /app/      the Jawhar interface, RESTRICTED, static from apps/jawhar-web
#   /jawhar/   the Jawhar API, RESTRICTED, proxied to Odoo
#   /odoo, /web, /websocket …   the Odoo back office, RESTRICTED, proxied to
#                               Odoo 19 on 127.0.0.1:8072
#
# NOT INSTALLED. This file is a proposal for review. Installing it on the VPS
# and creating the DNS record are production-infrastructure changes and need a
# named approval (docs/mumtaz-jewel/CLAUDE_CODE_HANDOFF.md, section 3).
#
# Before this block will load, two things must exist:
#   1. an A record for `jewel` pointing at the VPS, made by whoever holds the
#      DNS for mumtaz.digital;
#   2. a certificate, by the same method the other sites on this box use:
#        certbot certonly --nginx -d jewel.mumtaz.digital
#      Until it exists nginx will refuse to start with this block in place, so
#      obtain the certificate first.
#
# Installing, once approved:
#   mkdir -p /opt/mumtaz/jewel-landing
#   cp -r <checkout>/website/jewel/. /opt/mumtaz/jewel-landing/
#   cp jewel.mumtaz.digital.conf /etc/nginx/sites-available/
#   ln -s /etc/nginx/sites-available/jewel.mumtaz.digital.conf \
#         /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# It adds a new server block and touches no other site's config.
#
# `listen 443 ssl;` without `http2` matches the other confs in this repo and
# works on every nginx version. On nginx 1.25+ you may add `http2 on;`.
#
# Why the paths are split the way they are: Odoo owns its own URL prefixes and
# cannot be mounted under a sub-path, so the landing page takes `/` exactly
# and Odoo keeps the prefixes it already uses. Keep any new landing-page asset
# under /site/ so it can never collide with an Odoo route.

upstream jewel_odoo {
    server 127.0.0.1:8072;
}
upstream jewel_odoo_poll {
    server 127.0.0.1:8073;
}

server {
    listen 443 ssl;
    server_name jewel.mumtaz.digital;

    ssl_certificate     /etc/letsencrypt/live/jewel.mumtaz.digital/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jewel.mumtaz.digital/privkey.pem;

    root  /opt/mumtaz/jewel-landing;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 100m;
    access_log /opt/mumtaz/logs/jewel.log;
    error_log  /opt/mumtaz/logs/jewel.error.log;

    gzip on;
    gzip_types text/css text/plain application/javascript application/json
               application/xml image/svg+xml;

    # ---- the landing page: public ----------------------------------------
    # While the demo database behind it holds only synthetic data and the
    # product is in development, the host stays out of search results. Drop
    # this header and the robots.txt below when the owner wants it indexed.
    location = / {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /index.html =404;
    }

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Landing-page assets live under /site/ so they cannot shadow an Odoo
    # route. Serving from the filesystem; 404 rather than falling through.
    location /site/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # ---- the Jawhar interface: restricted like the demo system ------------
    # The product's own front end (apps/jawhar-web, built to static files and
    # published to /opt/mumtaz/jewel-app). It talks only to /jawhar/, below.
    # Hashed assets are immutable; index.html is never cached, so a deploy
    # shows up on the next load.
    location ^~ /app/ {
        satisfy any;
        # allow 203.0.113.4/32;
        deny all;
        auth_basic           "Jawhar demo";
        auth_basic_user_file /etc/nginx/.htpasswd-jewel;

        alias /opt/mumtaz/jewel-app/;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /app/index.html;
    }
    location ^~ /app/assets/ {
        satisfy any;
        # allow 203.0.113.4/32;
        deny all;
        auth_basic           "Jawhar demo";
        auth_basic_user_file /etc/nginx/.htpasswd-jewel;

        alias /opt/mumtaz/jewel-app/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Odoo lazy-loads some module assets by module path, outside the prefixes
    # below: /partner_autocomplete/static/lib/jsvat.js was the first one seen
    # (an OwlError "AssetsLoadingError" in the back office on 11 Nov 2026,
    # because the catch-all answered with the landing page's HTML). Any
    # /<module>/static/ path belongs to Odoo. Regex locations are tried in
    # order and only after the exact and ^~ prefix matches above, so / , /app/
    # and /site/ are unaffected.
    location ~ ^/[A-Za-z0-9_]+/static/ {
        satisfy any;
        # allow 203.0.113.4/32;
        deny all;
        auth_basic           "Jawhar demo";
        auth_basic_user_file /etc/nginx/.htpasswd-jewel;

        proxy_pass http://jewel_odoo;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_redirect off;
    }

    # ---- the demo system: restricted -------------------------------------
    # Access needs EITHER a listed address or the demo password. `satisfy any`
    # is what makes it either/or: with `satisfy all` a listed address would
    # still be prompted.
    #
    # Create the password file on the VPS (never commit it):
    #   htpasswd -c /etc/nginx/.htpasswd-jewel demo
    #
    # These are the prefixes Odoo 19 serves its backend on. If a future Odoo
    # route 404s here, add its prefix to this list rather than widening `/`.
    location ~ ^/(odoo|web|website|mail|report|longpolling|has_group|jsonrpc|xmlrpc|jawhar) {
        satisfy any;
        # Add the office / owner / demo-room addresses here, then reload:
        # allow 203.0.113.4/32;
        # allow 198.51.100.0/24;
        deny all;
        auth_basic           "Jawhar demo";
        auth_basic_user_file /etc/nginx/.htpasswd-jewel;

        proxy_pass http://jewel_odoo;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_read_timeout 720s;
        proxy_connect_timeout 720s;
        proxy_send_timeout 720s;
    }

    # Odoo's long-polling worker (chatter, activity notifications).
    location /websocket {
        satisfy any;
        # allow 203.0.113.4/32;
        deny all;
        auth_basic           "Jawhar demo";
        auth_basic_user_file /etc/nginx/.htpasswd-jewel;

        proxy_pass http://jewel_odoo_poll;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 720s;
    }

    # Anything else: the landing page, not the demo system.
    location / {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name jewel.mumtaz.digital;
    # Leave the ACME path reachable so certbot can renew over HTTP.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
