# Cache policy for the Jewel static site — map form, http context.
#
# Install at /etc/nginx/conf.d/jewel-cache-map.conf, which nginx already
# includes inside http {}. Then add ONE line to the site's server block:
#
#     add_header Cache-Control $jewel_cache always;
#
# deploy/jewel-staging/apply_cache_headers.sh does both, with a backup and an
# automatic rollback if `nginx -t` fails.
#
# Why this file exists
# --------------------
# On 11 Nov 2026 a deploy published the landing page correctly — the bytes on
# the server were verified identical to the repo — and the owner still saw the
# previous page in a fresh incognito window on mobile.
#
# The site sends no cache policy at all: only Last-Modified and ETag, with no
# Cache-Control and no Expires. When a response carries no explicit freshness,
# a cache may invent one, and the convention is about 10% of the document's
# age (RFC 9111 section 4.2.2). That file's Last-Modified was over five hours
# old, so a browser was entitled to serve it for roughly half an hour WITHOUT
# revalidating. A hard refresh cannot help when the request never leaves the
# device.
#
# Why a map and not location blocks
# ---------------------------------
# The first version of this file used `location ~* \.html$` and `location /`.
# That was wrong and would have broken the site: a server block that already
# defines `location /` — nearly every one does — fails to load with
# "duplicate location". nginx -t would have caught it, but only after someone
# had already edited a working config.
#
# A map carries no location of its own, so it cannot collide with anything the
# site already defines. It keys off the response's own Content-Type, which is
# also more accurate than matching URLs: "/" and "/apps/" serve index.html
# without ending in .html, and they get the right policy here for free.

map $sent_http_content_type $jewel_cache {
    # Anything not matched below: do not cache without asking. Being wrong in
    # this direction costs one conditional request; being wrong the other way
    # serves stale content for hours.
    default                   "no-cache, must-revalidate";

    # HTML: always revalidate. "no-cache" does NOT mean "do not store" — the
    # browser keeps its copy, asks whether the ETag is still current, and gets
    # a cheap 304 when nothing changed. A deploy is then visible on the next
    # request instead of up to half an hour later.
    "~*text/html"             "no-cache, must-revalidate";

    # Static assets: safe to cache hard. These are either unchanging or
    # replaced under a new name. One year is the conventional maximum.
    "~*^image/"               "public, max-age=31536000, immutable";
    "~*^font/"                "public, max-age=31536000, immutable";
    "~*application/javascript" "public, max-age=31536000, immutable";
    "~*text/css"              "public, max-age=31536000, immutable";
    "~*application/font-woff" "public, max-age=31536000, immutable";
}

# A note on the catch-all
# -----------------------
# The site's `try_files ... /index.html` makes a missing page answer 200 with
# the landing page instead of 404. That is deliberate, but it hides
# unpublished pages completely: /apps/ and /pricing/ sat missing for days
# while returning a healthy-looking 200.
#
# deploy/jewel-staging/verify_site.sh exists for that reason — it fingerprints
# the fallback and fails any page byte-identical to it. Run it after every
# publish; deploy.sh now does.
