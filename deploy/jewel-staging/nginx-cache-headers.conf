# Cache policy for the Jewel static site.
#
# Why this file exists
# --------------------
# On 11 Nov 2026 a deploy published the Jewel360 landing page correctly — the
# bytes on the server were verified identical to the repo — and the owner still
# saw the previous "Mumtaz Jewel" page, in a fresh incognito window, on mobile.
#
# The server was sending no cache policy at all: only Last-Modified and ETag,
# with no Cache-Control and no Expires. When a response carries no explicit
# freshness, a cache is permitted to invent one, and the usual heuristic is
# about 10% of the document's age (RFC 9111 §4.2.2). The file's Last-Modified
# was over five hours old, so browsers and mobile-network caches were entitled
# to serve it for roughly half an hour WITHOUT revalidating. A hard refresh
# does not help when the request never leaves the device.
#
# The fix is to say what we mean: HTML must always be revalidated; fingerprinted
# assets may be cached forever.
#
# How to apply (on the VPS, as root)
# ----------------------------------
#   1. Copy this file next to the site's server block, e.g.
#        /etc/nginx/snippets/jewel-cache.conf
#   2. Inside the `server { ... }` block for jewel.mumtaz.digital add:
#        include /etc/nginx/snippets/jewel-cache.conf;
#   3. nginx -t          # MUST print "syntax is ok" and "test is successful"
#   4. systemctl reload nginx
#
# Step 3 is not optional: `nginx -t` validates before anything is reloaded, so
# a mistake here cannot take the site down.

# --- HTML: never served from cache without checking first --------------------
# no-cache does NOT mean "do not store". It means "revalidate before reuse",
# which is exactly right: the browser keeps the copy, asks nginx whether its
# ETag is still current, and gets a cheap 304 when nothing changed. A deploy is
# then visible on the next request rather than up to half an hour later.
location ~* \.html$ {
    add_header Cache-Control "no-cache, must-revalidate" always;
}

# The directory form (/, /apps/, /pricing/) serves index.html but does not match
# the regex above, so it needs the same treatment.
location / {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri $uri/ $uri/index.html /index.html;
}

# --- Assets: safe to cache hard ----------------------------------------------
# Images, fonts, CSS and JS here are either unchanging or replaced under a new
# name. A year is the conventional maximum.
location ~* \.(?:css|js|png|jpg|jpeg|gif|webp|avif|svg|ico|woff2?|ttf|eot)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# --- A note on the catch-all -------------------------------------------------
# `try_files ... /index.html` above is what makes a missing page answer 200 with
# the landing page instead of 404. That is deliberate for a single-page feel,
# but it hides unpublished pages completely: /apps/ and /pricing/ sat missing
# for days while returning a healthy-looking 200.
#
# deploy/jewel-staging/verify_site.sh exists for exactly that reason — it
# fingerprints the fallback and fails any page that is byte-identical to it.
# Run it after every publish. If you would rather have honest 404s, drop the
# trailing `/index.html` from the try_files line above.
