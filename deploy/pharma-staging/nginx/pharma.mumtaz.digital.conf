# pharma.mumtaz.digital — generic Odoo 19 Community STAGING tenant.
#
# Same shape as the live erp.mumtaz.digital / ig2.mumtaz.digital vhosts on this
# box: one HTTP server block per tenant, `certbot --nginx -d <host>` adds the
# `listen 443 ssl` block and the redirect. Upstream is the tenant's own unit
# odoo-pharma.service (127.0.0.1:8076 http, 8077 websocket), whose
# dbfilter = ^mumtaz_%d$ maps this Host header to DB mumtaz_pharma. No ?db=.
#
# Install (gate — needs approval; adds one site, touches no other block):
#   cp deploy/pharma-staging/nginx/pharma.mumtaz.digital.conf /etc/nginx/sites-available/pharma.mumtaz.digital
#   ln -s /etc/nginx/sites-available/pharma.mumtaz.digital /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d pharma.mumtaz.digital        # once the A record resolves
# Roll back: rm /etc/nginx/sites-enabled/pharma.mumtaz.digital && nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name pharma.mumtaz.digital;

    # Fictional DEMO data on a staging host: never indexed.
    add_header X-Robots-Tag           "noindex, nofollow" always;
    add_header X-Frame-Options        "SAMEORIGIN"        always;
    add_header X-Content-Type-Options "nosniff"           always;

    client_max_body_size 200m;

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Odoo 19 bus (gevent worker)
    location /websocket {
        proxy_pass         http://127.0.0.1:8077;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 720s;
    }

    location /longpolling {
        proxy_pass         http://127.0.0.1:8077;
        proxy_set_header   Host $host;
        proxy_read_timeout 720s;
    }

    location ~* /web/static/ {
        proxy_pass        http://127.0.0.1:8076;
        proxy_set_header  Host $host;
        proxy_cache_valid 200 7d;
        expires           7d;
        add_header        Cache-Control "public, immutable" always;
    }

    location / {
        proxy_pass            http://127.0.0.1:8076;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_read_timeout    720s;
        proxy_connect_timeout 720s;
        proxy_send_timeout    720s;
        proxy_redirect        off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
}
