# pharma.mumtaz.digital — generic Odoo 19 Community STAGING tenant (DB mumtaz_pharma).
#
# Same shape as the erp.mumtaz.digital block in ops/deployment/nginx-mumtaz-platform.conf:
# HTTP-only here; certbot adds the `listen 443 ssl` block and the redirect
# (docs/ARCHITECTURE.md §7–8). Odoo picks the database from the Host header via
# dbfilter = ^mumtaz_%d$  (pharma.mumtaz.digital -> mumtaz_pharma), so there is
# no ?db= anywhere.
#
# Upstreams are addressed directly (not the shared `odoo_app`/`odoo_longpoll`
# names) so this file loads on its own; adjust the two ports if discover.sh
# shows the tenant worker elsewhere.
#
# Install (gate — needs approval; adds one site, touches no other block):
#   cp deploy/pharma-staging/nginx/pharma.mumtaz.digital.conf /etc/nginx/sites-available/pharma.mumtaz.digital
#   ln -s /etc/nginx/sites-available/pharma.mumtaz.digital /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d pharma.mumtaz.digital         # after the A record resolves
# Roll back: rm /etc/nginx/sites-enabled/pharma.mumtaz.digital && nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name pharma.mumtaz.digital;

    client_max_body_size 100m;

    access_log /var/log/nginx/pharma.mumtaz.digital.access.log;
    error_log  /var/log/nginx/pharma.mumtaz.digital.error.log;

    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy        "same-origin" always;
    # Staging with fictional DEMO data: keep it out of search engines.
    add_header X-Robots-Tag "noindex, nofollow"     always;

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location ~* /web/static/ {
        proxy_pass          http://127.0.0.1:8069;
        proxy_set_header    Host $host;
        proxy_cache_valid   200 90d;
        expires             90d;
        add_header          Cache-Control "public, immutable" always;
    }

    # Odoo 19 bus (gevent worker)
    location /websocket {
        proxy_pass          http://127.0.0.1:8072;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host       $host;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  720s;
    }

    location /longpolling {
        proxy_pass         http://127.0.0.1:8072;
        proxy_set_header   Host $host;
        proxy_read_timeout 720s;
    }

    location = / {
        return 302 /web;
    }

    location / {
        proxy_pass          http://127.0.0.1:8069;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  720s;
        proxy_connect_timeout 720s;
        proxy_send_timeout  720s;
        proxy_redirect      off;
    }
}
